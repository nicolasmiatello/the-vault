  button{display:flex;align-items:center;justify-content:center;gap:12px;width:84%;max-width:360px;min-height:52px;border:0;border-radius:999px;cursor:pointer;

  button{position:relative;animation:latido 1.7s ease-in-out infinite;will-change:transform;
    box-shadow:0 0 38px rgba(37,211,102,.6),0 0 0 1px rgba(255,255,255,.18) inset,0 6px 18px rgba(0,0,0,.5)}
  button::after{content:"";position:absolute;inset:-3px;border-radius:999px;border:2px solid rgba(70,235,135,.9);pointer-events:none;animation:aro 1.7s ease-out infinite;will-change:transform,opacity}

  @keyframes aro{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.1,1.45)}}
  @media (prefers-reduced-motion:reduce){button,button::after{animation:none}}
  button svg{width:25px;height:25px;flex:none}
  .bot{margin-top:-4px}
  .alt{text-align:center;color:#ebebeb;font-weight:600;font-size:clamp(13px,3.9vw,17px);padding:8px 16px 4px}
  .alt b{color:#ffc41c;font-weight:900}
  .alt a.perfil{color:#ffc41c;font-weight:900;text-decoration:underline;text-underline-offset:3px}
